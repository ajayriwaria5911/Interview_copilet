# backend/src/main/resources/application.yml
spring:
  application:
    name: interview-copilot-backend

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/interview_copilot?TimeZone=UTC
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    mongodb:
      uri: mongodb://localhost:27017/interview_copilot

  redis:
    host: localhost
    port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8082

app:
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/callback
  upload:
    dir: uploads/resumes